<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards — ZMA ARTCC</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap');
    :root {
      --blue-900:#0a1628;--blue-600:#1e4d8c;--blue-50:#eff6ff;
      --white:#ffffff;--gray-50:#f8fafc;--gray-100:#f1f5f9;
      --gray-200:#e2e8f0;--gray-400:#94a3b8;--gray-500:#64748b;
      --gray-700:#334155;--gray-800:#1e293b;
      --radius:10px;--shadow:0 4px 12px rgba(0,0,0,.08);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{font-size:15px}
    body{font-family:'DM Sans',sans-serif;background:var(--gray-50);color:var(--gray-800);-webkit-font-smoothing:antialiased;min-height:100vh}

    nav{background:var(--white);border-bottom:1px solid var(--gray-200);padding:0 32px;height:64px;display:flex;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    .nav-badge{background:var(--blue-600);color:#fff;font-size:.65rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 10px;border-radius:100px;margin-right:12px}
    .nav-title{font-size:1rem;font-weight:600;color:var(--blue-900)}
    .nav-count{margin-left:auto;font-size:.78rem;color:var(--gray-400)}

    .page{max-width:860px;margin:0 auto;padding:40px 24px 80px}

    /* ── Section headers ── */
    .section-header{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--gray-400);margin-bottom:14px;display:flex;align-items:center;gap:10px}
    .section-header::after{content:'';flex:1;height:1px;background:var(--gray-200)}

    /* ── Flashcard ── */
    .flashcard-area{display:flex;flex-direction:column;align-items:center;margin-bottom:48px}
    .card-counter{font-size:.82rem;color:var(--gray-400);margin-bottom:14px}
    .flashcard-wrap{perspective:1000px;width:100%;max-width:600px;height:220px;cursor:pointer;margin-bottom:16px}
    .flashcard-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,0,.2,1)}
    .flashcard-wrap.flipped .flashcard-inner{transform:rotateY(180deg)}
    .card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;box-shadow:var(--shadow);text-align:center}
    .card-front{background:var(--white);border:1px solid var(--gray-200)}
    .card-back{background:var(--blue-600);border:1px solid var(--blue-600);color:#fff;transform:rotateY(180deg)}
    .card-label{font-size:.65rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.4;margin-bottom:10px}
    .card-text{font-size:1.05rem;font-weight:500;line-height:1.5}
    .card-image{max-height:80px;max-width:100%;border-radius:8px;margin-bottom:10px;object-fit:contain}
    .card-hint{font-size:.75rem;color:var(--gray-400);margin-top:8px}

    .card-nav{display:flex;align-items:center;gap:12px}
    .card-nav button{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);padding:8px 20px;font-size:.875rem;font-weight:600;cursor:pointer;color:var(--gray-700);transition:background .15s}
    .card-nav button:hover{background:var(--gray-50)}
    .card-nav button:disabled{opacity:.4;cursor:not-allowed}
    .card-nav .shuffle-btn{background:var(--blue-50);border-color:#bfdbf7;color:var(--blue-600)}
    .progress-bar{width:100%;max-width:600px;height:4px;background:var(--gray-200);border-radius:100px;overflow:hidden;margin-bottom:4px}
    .progress-fill{height:100%;background:var(--blue-600);border-radius:100px;transition:width .3s}

    /* ── Q&A List ── */
    .qa-table{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    .qa-row{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--gray-100)}
    .qa-row:last-child{border-bottom:none}
    .qa-row:hover{background:var(--gray-50)}
    .qa-cell{padding:14px 20px;font-size:.88rem;line-height:1.6;color:var(--gray-700)}
    .qa-cell.term{font-weight:600;color:var(--gray-800);border-right:1px solid var(--gray-100)}
    .qa-cell img{max-width:100%;max-height:80px;border-radius:6px;margin-top:6px;object-fit:contain}
    .qa-header{background:var(--gray-50);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--gray-500);padding:10px 20px;display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--gray-200)}

    .search-wrap{margin-bottom:14px}
    .search-input{width:100%;padding:10px 14px;border:1px solid var(--gray-200);border-radius:var(--radius);font-size:.875rem;font-family:inherit;background:var(--white)}
    .search-input:focus{outline:none;border-color:var(--blue-600)}

    footer{position:fixed;bottom:0;left:0;right:0;background:rgba(15,23,42,.82);backdrop-filter:blur(4px);text-align:center;padding:6px 16px;font-size:.72rem;color:rgba(255,255,255,.45)}
  </style>
</head>
<body>

  <nav>
    <span class="nav-badge">ZMA ARTCC</span>
    <span class="nav-title" id="setTitle">Flashcards</span>
    <span class="nav-count" id="setCount"></span>
  </nav>

  <div class="page">

    <!-- Mode Toggle -->
    <div style="display:flex;gap:0;background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);overflow:hidden;margin-bottom:32px;width:fit-content;">
      <button id="tabFlashcards" onclick="showMode('flashcards')"
        style="padding:10px 24px;font-size:.875rem;font-weight:600;border:none;cursor:pointer;background:var(--blue-600);color:#fff;transition:background .15s;">
        Flashcards
      </button>
      <button id="tabTerms" onclick="showMode('terms')"
        style="padding:10px 24px;font-size:.875rem;font-weight:600;border:none;cursor:pointer;background:transparent;color:var(--gray-500);transition:background .15s;">
        Terms &amp; Definitions
      </button>
    </div>

    <!-- Flashcard section -->
    <div id="modeFlashcards">
      <div class="flashcard-area">
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="card-counter" id="cardCounter">— / —</div>
      <div class="flashcard-wrap" id="flashcardWrap" onclick="flipCard()">
        <div class="flashcard-inner" id="flashcardInner">
          <div class="card-face card-front" id="cardFront">
            <div class="card-label">Term</div>
            <div class="card-text" id="frontText">Loading...</div>
          </div>
          <div class="card-face card-back" id="cardBack">
            <div class="card-label" style="color:rgba(255,255,255,.5);">Definition</div>
            <div class="card-text" id="backText"></div>
          </div>
        </div>
      </div>
      <div style="font-size:.75rem;color:var(--gray-400);margin-bottom:12px;" id="clickHint">Click card to flip</div>
      <div class="card-nav">
        <button onclick="prevCard()" id="prevBtn" disabled>← Prev</button>
        <button onclick="nextCard()" id="nextBtn">Next →</button>
        <button class="shuffle-btn" onclick="shuffleCards()">⇄ Shuffle</button>
      </div>
    </div>

      </div>
    </div><!-- /modeFlashcards -->

    <!-- Q&A List -->
    <div id="modeTerms" style="display:none;">
      <div class="search-wrap">
      <input class="search-input" id="searchInput" placeholder="Search terms or definitions..." oninput="filterQA()">
    </div>
    <div class="qa-table">
      <div class="qa-header"><span>Term</span><span>Definition</span></div>
      <div id="qaList"></div>
    </div>
    </div><!-- /modeTerms -->

  </div>

  <footer>For simulation purposes only. All content is used exclusively within the virtual Miami ARTCC (ZMA). Not affiliated with real-world aviation.</footer>

  <script>
    // ── Config — change this per page ──
    // The JSON file should be in the same folder as this HTML file
    const JSON_FILE = document.currentScript?.dataset?.json ||
      window.location.pathname.replace('.html', '.json').replace('flashcards-','flashcards-').split('/').pop();

    let allCards = [];
    let cards = [];
    let currentIdx = 0;
    let isFlipped = false;

    function showMode(mode) {
      document.getElementById('modeFlashcards').style.display = mode === 'flashcards' ? 'block' : 'none';
      document.getElementById('modeTerms').style.display = mode === 'terms' ? 'block' : 'none';
      document.getElementById('tabFlashcards').style.background = mode === 'flashcards' ? 'var(--blue-600)' : 'transparent';
      document.getElementById('tabFlashcards').style.color = mode === 'flashcards' ? '#fff' : 'var(--gray-500)';
      document.getElementById('tabTerms').style.background = mode === 'terms' ? 'var(--blue-600)' : 'transparent';
      document.getElementById('tabTerms').style.color = mode === 'terms' ? '#fff' : 'var(--gray-500)';
    }

    async function loadCards() {
      try {
        // Try to get the set name from the filename
        const filename = window.location.pathname.split('/').pop().replace('.html','');
        const jsonPath = filename.replace('flashcards-','flashcards-') + '.json';

        const res = await fetch(jsonPath);
        if (!res.ok) throw new Error('Not found');
        const data = await res.json();

        document.getElementById('setTitle').textContent = data.name || 'Flashcards';
        document.title = `${data.name || 'Flashcards'} — ZMA ARTCC`;
        document.getElementById('setCount').textContent = `${data.cards.length} cards`;

        allCards = data.cards || [];
        cards = [...allCards];
        renderCard();
        renderQA(allCards);
      } catch(e) {
        document.getElementById('frontText').textContent = 'Could not load flashcards. Make sure the JSON file is in the same folder.';
        console.error(e);
      }
    }

    function renderCard() {
      if (!cards.length) return;
      isFlipped = false;
      document.getElementById('flashcardWrap').classList.remove('flipped');

      const card = cards[currentIdx];
      document.getElementById('frontText').innerHTML =
        (card.image ? `<img src="${card.image}" class="card-image" onerror="this.style.display='none'">` : '') +
        card.term;
      document.getElementById('backText').textContent = card.definition;
      document.getElementById('cardCounter').textContent = `${currentIdx + 1} / ${cards.length}`;
      document.getElementById('progressFill').style.width = `${((currentIdx+1)/cards.length)*100}%`;
      document.getElementById('prevBtn').disabled = currentIdx === 0;
      document.getElementById('nextBtn').disabled = currentIdx === cards.length - 1;
    }

    function flipCard() {
      isFlipped = !isFlipped;
      document.getElementById('flashcardWrap').classList.toggle('flipped', isFlipped);
      document.getElementById('clickHint').textContent = isFlipped ? 'Click to show term' : 'Click card to flip';
    }

    function nextCard() {
      if (currentIdx < cards.length - 1) { currentIdx++; renderCard(); }
    }

    function prevCard() {
      if (currentIdx > 0) { currentIdx--; renderCard(); }
    }

    function shuffleCards() {
      cards = [...cards].sort(() => Math.random() - .5);
      currentIdx = 0;
      renderCard();
    }

    function renderQA(list) {
      document.getElementById('qaList').innerHTML = list.map(c => `
        <div class="qa-row">
          <div class="qa-cell term">
            ${c.image ? `<img src="${c.image}" onerror="this.style.display='none'">` : ''}
            ${c.term}
          </div>
          <div class="qa-cell">${c.definition}</div>
        </div>`).join('');
    }

    function filterQA() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      renderQA(q ? allCards.filter(c => c.term.toLowerCase().includes(q) || c.definition.toLowerCase().includes(q)) : allCards);
    }

    // Keyboard navigation
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') nextCard();
      if (e.key === 'ArrowLeft') prevCard();
      if (e.key === ' ') { e.preventDefault(); flipCard(); }
    });

    loadCards();
  </script>
</body>
</html>
